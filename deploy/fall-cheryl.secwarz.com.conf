# Cheryl's Newscast — public podcast feed, proxied to hearth over WireGuard.
#
# Install on fall:
#   cp fall-cheryl.secwarz.com.conf /usr/local/nginx/conf/sites-available/cheryl.secwarz.com
#   ln -s ../sites-available/cheryl.secwarz.com /usr/local/nginx/conf/sites-enabled/cheryl.secwarz.com
#   /usr/local/nginx/sbin/nginx -t && /usr/local/nginx/sbin/nginx -s reload
#
# TLS: if there is no cert yet for cheryl.secwarz.com:
#   certbot --nginx -d cheryl.secwarz.com
# (*.secwarz.com already points at fall, so DNS needs no changes.)

upstream cheryl_newscast {
    server 10.0.10.107:80;   # hearth, over wg0
}

server {
    listen 80;
    server_name cheryl.secwarz.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name cheryl.secwarz.com;

    ssl_certificate     /etc/letsencrypt/live/cheryl.secwarz.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cheryl.secwarz.com/privkey.pem;

    location / {
        proxy_pass http://cheryl_newscast;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Episodes are large static files — stream them, don't buffer on fall.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
