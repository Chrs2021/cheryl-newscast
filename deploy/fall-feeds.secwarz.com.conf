# feeds.secwarz.com — public feed host, proxied to hearth over WireGuard.
#
# Install on fall:
#   cp fall-feeds.secwarz.com.conf /usr/local/nginx/conf/sites-available/feeds.secwarz.com
#   ln -s ../sites-available/feeds.secwarz.com /usr/local/nginx/conf/sites-enabled/feeds.secwarz.com
#
# SSL, one time (the 443 block below stays commented until the cert exists):
#   1. /usr/local/nginx/sbin/nginx -t && /usr/local/nginx/sbin/nginx -s reload
#   2. mkdir -p /var/www/html
#      certbot certonly --webroot -w /var/www/html -d feeds.secwarz.com
#   3. Uncomment the 443 server block below.
#   4. /usr/local/nginx/sbin/nginx -t && /usr/local/nginx/sbin/nginx -s reload
# Renewals keep working: certbot renew (webroot challenge via port 80).

server {
    listen 80;
    server_name feeds.secwarz.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    return 301 https://$host$request_uri;
}

