# feeds.secwarz.com — public feed host, proxied to hearth over WireGuard.
#
# Install on fall:
#   cp fall-feeds.secwarz.com.conf /usr/local/nginx/conf/sites-available/feeds.secwarz.com
#   ln -s ../sites-available/feeds.secwarz.com /usr/local/nginx/conf/sites-enabled/feeds.secwarz.com
#   /usr/local/nginx/sbin/nginx -t && /usr/local/nginx/sbin/nginx -s reload
#
# Cert (once): certbot --nginx -d feeds.secwarz.com

server {
    listen 80;
    server_name feeds.secwarz.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name feeds.secwarz.com;

    ssl_certificate     /etc/letsencrypt/live/feeds.secwarz.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/feeds.secwarz.com/privkey.pem;

    location / {
        proxy_pass http://10.0.10.107:80;  # hearth over wg0

        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;    # stream big MP3s, don't buffer them on fall
        proxy_read_timeout 300s;
    }
}
